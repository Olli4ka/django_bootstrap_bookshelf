{% extends "base.html" %}
{% load static %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="d-flex flex-column justify-content-center align-items-center text-center" style="min-height: 70vh;">

    <h1 class="display-1 fw-bold">404</h1>
    <h3 class="mb-3">😕 Oops! Page not found</h3>

    <p class="text-muted mb-4" style="max-width: 500px;">
        The page you’re looking for doesn’t exist or may have been moved.
    </p>

    <a href="{% url 'books:book_list' %}" class="btn btn-primary px-4 py-2">
        ← Back to Home
    </a>

</div>
{% endblock %}
